<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Preview - Mound Mascot</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f0f0f0;
    }
  </style>
  <script src="./fxhash.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      setTimeout(() => {
        if (window.$fx) {
          console.log('Preview html capturing...');
          window.$fx.preview();
        }
      }, 500);
    });
  </script>
</head>
<body>
  <!-- This is a simple preview HTML that will show a static image -->
  <img id="preview-image" src="image.png" alt="Mound Mascot Preview" style="max-width: 100%; max-height: 100vh;">
</body>
</html>
